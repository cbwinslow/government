[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opendiscourse"
version = "0.1.0"
description = "A unified political intelligence and honesty scoring engine."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "celery>=5.6.3",
    "cohere>=7.0.1",
    "epstein-pipeline>=1.0.4",
    "fastapi>=0.136.3",
    "haystack-ai>=2.29.0",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.2.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pylint>=4.0.5",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "qdrant-client>=1.18.0",
    "redis>=8.0.0",
    "sentence-transformers>=5.5.1",
    "spacy>=3.8.14",
    "sqlalchemy>=2.0.50",
    "streamlit>=1.58.0",
    "torch>=2.12.0",
    "uvicorn>=0.49.0",
    "httpx>=0.28.1",
    "openai>=2.38.0",
    "pyyaml>=6.0.3",
    # Agent tools
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-openai>=0.2.0",
    "langfuse>=2.50.0",
    "apscheduler>=3.11.2",
    "dlt[postgres]>=1.27.2",
    "qdrant-haystack>=10.3.0",
    "requests>=2.34.2",
    "llama-index>=0.14.22",
    "llama-index-vector-stores-qdrant>=0.10.1",
    "llama-index-readers-file>=0.6.0",
    "lxml>=6.1.1",
    "cssselect>=1.4.0",
    "html5lib>=1.1",
    "beautifulsoup4>=4.14.3",
    "scrapelib>=2.4.1",
    "pytz>=2026.2",
    "rfc3987>=1.3.8",
]

[tool.pytest.ini_options]
# Run only tests in this repo (none by default) and avoid descending into sub-repositories.
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-q -ra"
norecursedirs = [
    "congress",
    "courtlistener",
    "epstein",
    "financial-disclosures",
    "openstates-monorepo",
    "politician-finance-pack",
    "gov-skills",
    "data",
    ".git",
    ".venv",
    ".refact",
    "__pycache__",
]

[tool.hatch.build.targets.wheel]
packages = ["src/opendiscourse"]
