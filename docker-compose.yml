services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: opendiscourse
      POSTGRES_USER: opendiscourse
      POSTGRES_PASSWORD: opendiscourse
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opendiscourse -d opendiscourse"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - opendiscourse-postgres:/var/lib/postgresql/data

volumes:
  opendiscourse-postgres:
